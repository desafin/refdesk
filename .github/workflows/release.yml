# Builds the release bundles. On a pushed tag v<version> it checks that the tag matches the
# version in Cargo.toml and that CHANGELOG.md has a dated section for it, runs the gate,
# packages, and publishes a GitHub release with the files in dist/. Run by hand
# (workflow_dispatch) it only builds and keeps the bundles as a workflow artifact.
# The build steps are the scripts that scripts/verify-in-container.sh runs in ubuntu:24.04.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build the bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies and the Rust toolchain
        run: packaging/setup-build-env.sh

      - name: Check the version, the tag and the changelog
        id: version
        run: |
          version="$(packaging/version.sh)"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          mkdir -p notes
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the version $version in Cargo.toml"
              exit 1
            fi
            packaging/release-notes.sh "$version" --require-date >notes/release-notes.md
          else
            packaging/release-notes.sh "$version" >notes/release-notes.md
          fi
          cat notes/release-notes.md

      - name: scripts/check.sh
        run: scripts/check.sh

      - name: THIRD-PARTY-NOTICES.md is up to date
        run: scripts/third-party-notices.sh --check

      - name: scripts/package.sh
        run: scripts/package.sh

      - name: Keep the bundles
        uses: actions/upload-artifact@v7
        with:
          name: refdesk-${{ steps.version.outputs.version }}
          path: |
            dist/
            notes/
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifact
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l artifact/dist
          prerelease=()
          case "$TAG" in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "$TAG" artifact/dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "refdesk ${TAG#v}" \
            --notes-file artifact/notes/release-notes.md \
            "${prerelease[@]}"

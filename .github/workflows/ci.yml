# The completion gate on every push to main and every pull request. It runs the same scripts as
# a local checkout and scripts/verify-in-container.sh: packaging/setup-build-env.sh installs
# the apt packages from packaging/build-deps.txt and the toolchain from rust-toolchain.toml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies and the Rust toolchain
        run: packaging/setup-build-env.sh

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: scripts/check.sh
        run: scripts/check.sh

      - name: THIRD-PARTY-NOTICES.md is up to date
        run: scripts/third-party-notices.sh --check

[package]
name = "refdesk"
description = "Desktop viewer for reading several software documentation PDFs at once"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "refdesk"
path = "src/main.rs"

[dependencies]
refdesk-core.workspace = true
eframe.workspace = true
egui.workspace = true
egui_dock.workspace = true
rfd.workspace = true
log.workspace = true
png.workspace = true
# Local time for capture file names; pure Rust, reads the system time zone itself.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system"] }

[dev-dependencies]
egui_kittest.workspace = true
refdesk-core = { workspace = true, features = ["testutil"] }

[lints]
workspace = true
